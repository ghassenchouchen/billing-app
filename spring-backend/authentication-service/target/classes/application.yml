server:
  port: 8087

spring:
  application:
    name: authentication-service

  datasource:
    url: jdbc:mysql://localhost:3306/db_authentication?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: your-256-bit-secret-key-for-jwt-token-generation-minimum-32-chars
  access-expiration: 28800000   # 8 hours (work day)
  refresh-expiration: 2592000000 # 30 days

# Hardcoded admin credentials (initial bootstrap)
app:
  admin:
    username: admin
    password: admin123

  security:
    max-failed-attempts: 5

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
