server:
  port: 8081

spring:
  application:
    name: customer-service
    
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/db_customer?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true
        
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        max.block.ms: 1000
    consumer:
      group-id: customer-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.telecom.*
        spring.json.value.default.type: java.util.LinkedHashMap

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.telecom.customer: DEBUG
    org.springframework.kafka: INFO

kafka:
  topics:
    sim-lifecycle: ${SIM_LIFECYCLE_TOPIC:boutique.sim.lifecycle}
    sim-lifecycle-dlq: ${SIM_LIFECYCLE_DLQ_TOPIC:boutique.sim.lifecycle.dlq}
  retry:
    max-attempts: ${SIM_EVENT_RETRY_ATTEMPTS:2}
    initial-interval-ms: ${SIM_EVENT_RETRY_INITIAL_INTERVAL_MS:1000}
    multiplier: ${SIM_EVENT_RETRY_MULTIPLIER:2.0}
    max-interval-ms: ${SIM_EVENT_RETRY_MAX_INTERVAL_MS:30000}
