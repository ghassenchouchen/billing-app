server:
  port: 8084

spring:
  application:
    name: usage-service
    
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/db_usage?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        linger.ms: 10
        max.block.ms: 1000
    consumer:
      group-id: usage-service
      auto-offset-reset: earliest
    client-id: usage-service

# OpenAPI/Swagger Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
    filter: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.telecom.usage: DEBUG
    org.springframework.kafka: INFO
    org.hibernate: WARN

# Feign clients for inter-service calls
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000

services:
  customer-url: http://localhost:8081
  catalog-url: http://localhost:8082
  subscription-url: http://localhost:8083

# Kafka Topics
kafka:
  topics:
    usage-events: usage.events
