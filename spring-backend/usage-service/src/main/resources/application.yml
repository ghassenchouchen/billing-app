server:
  port: 8084

spring:
  application:
    name: usage-service
    
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/db_usage?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: usage_app
    password: usage_app_pwd
    driver-class-name: com.mysql.cj.jdbc.Driver
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true
        
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        linger.ms: 10
    consumer:
      group-id: usage-service
      auto-offset-reset: earliest
    client-id: usage-service

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  metrics:
    export:
      simple:
        enabled: true

logging:
  level:
    root: INFO
    com.telecom.usage: DEBUG
    org.springframework.kafka: INFO
    org.hibernate: WARN

# CDR File Ingestion Configuration
cdr:
  ingestion:
    enabled: true
    incoming-directory: incoming
    processed-directory: processed
    failed-directory: failed²
    batch-size: 100
    # Scan interval in milliseconds (5 minutes)
    scan-interval: 300000
    # Initial delay in milliseconds (30 seconds)
    initial-delay: 30000

# Kafka Topics
kafka:
  topics:
    usage-events: usage.events
