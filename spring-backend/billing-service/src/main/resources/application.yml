server:
  port: 8085

spring:
  application:
    name: billing-service
    
  datasource:
    url: jdbc:mysql://localhost:3306/db_billing?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true
    username: root
    password: root
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
        
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.block.ms: 1000
    consumer:
      group-id: billing-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-brevo-login@example.com}
    password: ${MAIL_PASSWORD:your-brevo-smtp-key}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
    enabled: ${MAIL_ENABLED:false}

  thymeleaf:
    mode: HTML
    encoding: UTF-8

services:
  customer-url: ${CUSTOMER_SERVICE_URL:http://localhost:8081}
  catalog-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
  subscription-url: ${SUBSCRIPTION_SERVICE_URL:http://localhost:8083}
  usage-url: ${USAGE_SERVICE_URL:http://localhost:8084}

billing:
  tax-rate: 0.19  # TVA 19% (standard Tunisian rate)
  due-days: 15
  company-name: TélécomBilling
  company-address: Av. Habib Bourguiba, Tunis 1000
  company-tax-id: 1234567/A/B/000

# OpenAPI/Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.telecom.billing: DEBUG
    org.springframework.security: WARN
    feign: DEBUG
    org.springframework.cloud.openfeign: DEBUG

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
