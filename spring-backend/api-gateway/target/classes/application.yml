server:
  port: 8090

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      routes:
        # Authentication Service Routes
        - id: authentication-service
          uri: http://authentication-service:8087
          predicates:
            - Path=/api/auth/**,/api/users/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}

        # Authentication Service Swagger
        - id: authentication-service-docs
          uri: http://authentication-service:8087
          predicates:
            - Path=/authentication-service/v3/api-docs
          filters:
            - RewritePath=/authentication-service/v3/api-docs, /v3/api-docs

        # Customer Service Routes 
        - id: customer-service
          uri: http://customer-service:8081
          predicates:
            - Path=/api/customers/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
        
        # Customer Service Swagger
        - id: customer-service-docs
          uri: http://customer-service:8081
          predicates:
            - Path=/customer-service/v3/api-docs
          filters:
            - RewritePath=/customer-service/v3/api-docs, /v3/api-docs
            
        # Catalog Service Routes 
        - id: catalog-service
          uri: http://catalog-service:8082
          predicates:
            - Path=/api/services/**,/api/offres/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
        
        # Catalog Service Swagger
        - id: catalog-service-docs
          uri: http://catalog-service:8082
          predicates:
            - Path=/catalog-service/v3/api-docs
          filters:
            - RewritePath=/catalog-service/v3/api-docs, /v3/api-docs
            
        # Subscription Service Routes 
        - id: subscription-service
          uri: http://subscription-service:8083
          predicates:
            - Path=/api/subscriptions/**,/api/abonnements/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
        
        # Subscription Service Swagger
        - id: subscription-service-docs
          uri: http://subscription-service:8083
          predicates:
            - Path=/subscription-service/v3/api-docs
          filters:
            - RewritePath=/subscription-service/v3/api-docs, /v3/api-docs
            
        # Usage Service Routes 
        - id: usage-service
          uri: http://usage-service:8084
          predicates:
            - Path=/api/usage/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
        
        # Usage Service Swagger
        - id: usage-service-docs
          uri: http://usage-service:8084
          predicates:
            - Path=/usage-service/v3/api-docs
          filters:
            - RewritePath=/usage-service/v3/api-docs, /v3/api-docs
            
        # Billing Service Routes 
        - id: billing-service
          uri: http://billing-service:8085
          predicates:
            - Path=/api/invoices/**,/api/bills/**,/api/factures/**
        
        # Billing Service Swagger
        - id: billing-service-docs
          uri: http://billing-service:8085
          predicates:
            - Path=/billing-service/v3/api-docs
          filters:
            - RewritePath=/billing-service/v3/api-docs, /v3/api-docs
            
        # Payment Service Routes 
        - id: payment-service
          uri: http://payment-service:8086
          predicates:
            - Path=/api/payments/**
        
        # Payment Service Swagger
        - id: payment-service-docs
          uri: http://payment-service:8086
          predicates:
            - Path=/payment-service/v3/api-docs
          filters:
            - RewritePath=/payment-service/v3/api-docs, /v3/api-docs
            
        # Boutique Service Routes 
        - id: boutique-service
          uri: http://boutique-service:8088
          predicates:
            - Path=/api/boutiques/**,/api/sims/**
          filters:
            - RewritePath=/api/(?<segment>.*), /$\{segment}
        
        # Boutique Service Swagger
        - id: boutique-service-docs
          uri: http://boutique-service:8088
          predicates:
            - Path=/boutique-service/v3/api-docs
          filters:
            - RewritePath=/boutique-service/v3/api-docs, /v3/api-docs

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
            exposedHeaders:
              - "X-Correlation-Id"
              - "X-Request-Id"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: API Gateway
        url: /v3/api-docs
      - name: Authentication Service
        url: /authentication-service/v3/api-docs
      - name: Customer Service
        url: /customer-service/v3/api-docs
      - name: Catalog Service
        url: /catalog-service/v3/api-docs
      - name: Subscription Service
        url: /subscription-service/v3/api-docs
      - name: Usage Service
        url: /usage-service/v3/api-docs
      - name: Billing Service
        url: /billing-service/v3/api-docs
      - name: Payment Service
        url: /payment-service/v3/api-docs
      - name: Boutique Service
        url: /boutique-service/v3/api-docs

jwt:
  secret: your-256-bit-secret-key-for-jwt-token-generation-minimum-32-chars

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: INFO
