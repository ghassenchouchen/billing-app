apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: billing
  namespace: argocd
spec:
  description: Billing app GitOps project
  sourceRepos:
    - '*'
  destinations:
    - namespace: billing-dev
      server: https://kubernetes.default.svc
    - namespace: billing-prod
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
