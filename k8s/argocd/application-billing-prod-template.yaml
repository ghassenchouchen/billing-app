apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: billing-prod
  namespace: argocd
spec:
  project: billing
  source:
    repoURL: https://github.com/ghassenchouchen/billing-app-config.git
    targetRevision: main
    path: charts
  destination:
    # For in-cluster EKS Argo CD use kubernetes.default.svc. For external destination,
    # replace with the registered cluster API server.
    server: https://kubernetes.default.svc
    namespace: billing-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
