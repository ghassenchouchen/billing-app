apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: billing-dev
  namespace: argocd
spec:
  project: billing
  source:
    repoURL: https://github.com/ghassenchouchen/billing-app.git
    targetRevision: main
    path: k8s/environments/dev
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: billing-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
