apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: billing-dev
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  ports:
    - port: 8090
      targetPort: 8090
  selector:
    app: api-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: billing-dev
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: billing/api-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8090
          env:
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: billing-config
                  key: AUTH_SERVICE_URL
            - name: CUSTOMER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: billing-config
                  key: CUSTOMER_SERVICE_URL
            - name: CATALOG_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: billing-config
                  key: CATALOG_SERVICE_URL
            - name: SUBSCRIPTION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: billing-config
                  key: SUBSCRIPTION_SERVICE_URL
            - name: USAGE_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: billing-config
                  key: USAGE_SERVICE_URL
            - name: BILLING_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: billing-config
                  key: BILLING_SERVICE_URL
            - name: BOUTIQUE_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: billing-config
                  key: BOUTIQUE_SERVICE_URL
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 45
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
